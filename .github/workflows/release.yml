name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hidapi pyobjc-framework-CoreBluetooth pyobjc-framework-libdispatch pyobjc-framework-Quartz pyobjc-framework-Cocoa pyinstaller
      - name: Build LogiFollow.app
        run: |
          pyinstaller --noconfirm packaging/LogiFollow-macos.spec
          ditto -c -k --sequesterRsrc --keepParent dist/LogiFollow.app LogiFollow-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: LogiFollow-macos-arm64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hidapi pyinstaller
      - name: Build LogiFollow-win-x64.exe
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name LogiFollow-win-x64 `
            --hidden-import hid `
            --hidden-import logifollow `
            --hidden-import ble_transport `
            --hidden-import edge_config `
            --hidden-import edge_watcher `
            --hidden-import tray_ui `
            --collect-binaries hid `
            logifollow_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/LogiFollow-win-x64.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          fi
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../LogiFollow-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: LogiFollow-android.apk

  release:
    needs: [build-macos, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/LogiFollow-macos-arm64.zip
            artifacts/LogiFollow-win-x64.exe
            artifacts/LogiFollow-android.apk
          body: |
            ## LogiFollow ${{ github.ref_name }}

            로지텍 키보드·마우스 Easy-Switch 동시 전환 및 화면 경계 전환(Edge Switch) 도구입니다.
            USB Logi Bolt 리시버와 블루투스 직결(BLE++)을 모두 지원합니다.

            ### 다운로드
            - **macOS (Apple Silicon):** `LogiFollow-macos-arm64.zip` — 압축 해제 후 `LogiFollow.app` 실행 (최초 1회 우클릭 → 열기 또는 `xattr -cr LogiFollow.app`)
            - **Windows (64-bit):** `LogiFollow-win-x64.exe` — 파이썬 설치 없이 바로 실행 (우하단 트레이 아이콘에서 설정)
            - **Android (폰 / 삼성 DeX):** `LogiFollow-android.apk` — 폰에서 직접 설치 또는 `adb install -r LogiFollow-android.apk`
            - **iOS / iPadOS:** 저장소의 `ios/LogiFollow.xcodeproj`를 Xcode로 열어 직접 빌드·설치 (`ios/README.md` 참조)
